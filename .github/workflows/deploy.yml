# Deploys Shekhawati Impex ERP to the existing Azure setup on every push to main.
# See docs/HOSTING-AND-SECRETS.md for what runs where.
#
#   verify    lint, rule tests, production build - nothing ships if these fail
#   backend   prisma migrate deploy, then the API zip to App Service
#             (package.json + src + prisma + public, built on Azure by Oryx,
#             exactly as the manual redeploy does)
#   frontend  the React build to the Static Web App
#
# GitHub repository secrets needed:
#   AZURE_WEBAPP_PUBLISH_PROFILE   App Service -> Overview -> Download publish profile
#   DATABASE_URL                   same value as Key Vault secret DATABASE-URL
#   SWA_DEPLOYMENT_TOKEN           Static Web App -> Overview -> Manage deployment token
# GitHub-hosted runners reach the database through its "allow Azure services" rule.

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two overlapping deploys would run two `migrate deploy`s against one database.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: shekhawati-erp-u4dfh
  API_URL: https://shekhawati-erp-u4dfh.azurewebsites.net/api

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholders so config validation passes; nothing here touches a database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-placeholder-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace server run db:generate
      - run: npm run lint
      - run: npm run test:rules
      - run: npm run build

  backend:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Migrations run BEFORE the new code. `migrate deploy` only applies
      # pending migrations - it never resets and never seeds.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm --workspace server run db:deploy

      # The App Service still serves the combined site from public/ while
      # CLIENT_DIST is set, so the client build ships inside the API zip too.
      - run: npm run build
        env:
          VITE_API_URL: ${{ env.API_URL }}
      - name: Package
        run: |
          mkdir -p pkg
          cp server/package.json pkg/
          cp -r server/src server/prisma pkg/
          cp -r client/dist pkg/public
          find pkg -name '*.map' -delete
          cd pkg && zip -qr ../api.zip .

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api.zip

  frontend:
    # After the backend, so the new client never talks to the old API.
    needs: backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ env.API_URL }}
      - run: find client/dist -name '*.map' -delete
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: client/dist
          skip_app_build: true
